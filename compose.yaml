name: lab1-animal-shelter
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shelter}
      POSTGRES_USER: ${DB_USER:-shelter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shelter_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - shelter-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-shelter}
      DB_USER: ${DB_USER:-shelter}
      DB_PASSWORD: ${DB_PASSWORD:-shelter_local}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 20
volumes:
  shelter-data:
