spring:
  application:
    name: lab1-animal-shelter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shelter}
    username: ${DB_USER:shelter}
    password: ${DB_PASSWORD:shelter_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
